name: tether_capture
description: "Tether Capture: custom camera with a resilient, offline-first batch upload queue."
publish_to: 'none'

# build-name becomes the Android versionName, build-number the versionCode.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  camera: ^0.12.1
  connectivity_plus: ^7.3.2
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  sqflite: ^2.4.4
  workmanager: ^0.10.10

dev_dependencies:
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
