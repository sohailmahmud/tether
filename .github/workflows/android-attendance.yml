name: Android · Tether Attendance

on:
  push:
    branches: [main]
    paths:
      - "android-attendance/**"
      - ".github/workflows/android-attendance.yml"
  pull_request:
    paths:
      - "android-attendance/**"
      - ".github/workflows/android-attendance.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-attendance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install SDK platform 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Formatting (ktlint)
        run: ./gradlew ktlintCheck

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Unit and Compose UI tests (JVM, Robolectric)
        run: ./gradlew testDebugUnitTest

      - name: Build debug and release APKs
        # No signing secrets in CI: the release build falls back to the debug key,
        # which still proves that the R8-shrunk release build works.
        run: ./gradlew assembleDebug assembleRelease

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          tests = failures = skipped = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              suite = ET.parse(path).getroot()
              tests += int(suite.get("tests"))
              failures += int(suite.get("failures")) + int(suite.get("errors"))
              skipped += int(suite.get("skipped"))
          print("### Tether Attendance")
          print(f"| Tests | Failed | Skipped |\n|---|---|---|\n| {tests} | {failures} | {skipped} |")
          PY

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-attendance-reports
          path: |
            android-attendance/app/build/reports/
            android-attendance/app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tether-attendance-debug-apk
          path: android-attendance/app/build/outputs/apk/debug/*.apk
